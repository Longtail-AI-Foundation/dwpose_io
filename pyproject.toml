[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dwpose_io"
version = "0.1.0"
description = "Reader, writer and checker for the ISL DWPose safetensors format"
requires-python = ">=3.8"
dependencies = ["numpy", "safetensors"]

[tool.setuptools]
packages = ["dwpose_io"]
